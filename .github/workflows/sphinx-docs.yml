name: Build and Deploy Sphinx Documentation

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11  # Use the Python version compatible with your project

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install sphinx sphinx-rtd-theme  # Add any Sphinx extensions you use

      # Automatically generate Sphinx .rst files for modules
      - name: Generate Sphinx API docs
        run: |
          sphinx-apidoc -o docs/source/ src/cobtools

      # Build the documentation
      - name: Build Sphinx documentation
        run: |
          cd docs
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          make html

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html