[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cobtools"
version = "0.1.0"
description = "A modern Python package for astrometry, statistics, kinematics, and IO."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["astrometry", "statistics", "kinematics", "io"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.9.2",
    "scipy>=1.14.1",
    "emcee>=3.1.6",
    "pandas>=2.2.1",
    "astroquery>=0.4.10",
    "lasair>=0.1.2",
    "click>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "sphinx",
    "sphinx-rtd-theme"
]

[project.scripts]
gaia_single_source = "cobtools.cli.gaia.query_single_source:query_useful_info"

[tool.black]
line-length = 79

[tool.ruff]
target-version = "py310"
lint.select = ["E", "F", "W", "C90"]
lint.ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.setuptools.package-data]
"cobtools" = ["data/*"]
